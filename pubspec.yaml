name: teamup_exe
description: TeamUp EXE Android app for FPT University students and administrators.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^16.0.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.7.1
  cloud_firestore: ^6.10.2
  firebase_crashlytics: ^5.4.1
  firebase_messaging: ^16.7.1
  flutter_riverpod: ^3.4.3
  firebase_ai: 4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
